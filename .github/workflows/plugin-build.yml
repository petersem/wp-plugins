name: Build and Release Changed Plugins

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch full history
        run: |
          git fetch --prune --unshallow || true
          git fetch origin main

      - name: Check if any root-level PHP file changed
        id: phpcheck
        run: |
          BASE=$(git merge-base HEAD^ HEAD)
          CHANGED=$(git diff --name-only "$BASE" HEAD)

          if echo "$CHANGED" | grep -qE "^[^/]+\.php$"; then
            echo "php_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "php_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine changed plugins
        id: changes
        if: steps.phpcheck.outputs.php_changed == 'true'
        run: |
          BASE=$(git merge-base HEAD^ HEAD)
          CHANGED=$(git diff --name-only "$BASE" HEAD)

          PLUGINS=""
          for file in *.php; do
            if echo "$CHANGED" | grep -q "^$file$"; then
              name="${file%.php}"
              PLUGINS="${PLUGINS}${name}\n"
            fi
          done

          {
            echo "plugins<<EOF"
            echo -e "$PLUGINS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Process each changed plugin
        if: steps.changes.outputs.plugins != ''
        run: |
          mkdir -p build

          echo "${{ steps.changes.outputs.plugins }}" | while read -r name; do
            [ -z "$name" ] && continue

            version=$(grep -m1 -E "Version:[[:space:]]*[0-9]+\.[0-9]+\.[0-9]+" "$name.php" \
              | sed -E 's/.*Version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/')

            if [ -z "$version" ]; then
              echo "ERROR: No version found in $name.php — skipping."
              continue
            fi

            mkdir -p "build/$name"
            cp "$name.php" "build/$name/$name.php"

            (
              cd build
              zip -r "${name}-${version}.zip" "$name"
            )

            echo "$name:$version" >> build/plugin_versions.txt
          done

      - name: Create release for each plugin
        if: steps.changes.outputs.plugins != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f build/plugin_versions.txt ]; then
            echo "No plugins to release. Skipping."
            exit 0
          fi

          while IFS=: read -r name version; do
            tag="${name}-${version}"
            title="${name}-${version}"

            gh release create "$tag" "build/${name}-${version}.zip" \
              --title "$title" \
              --notes "Automated release for $name version $version"

          done < build/plugin_versions.txt
