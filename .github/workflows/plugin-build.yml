name: Build Changed Plugins and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine changed plugins
        id: changes
        run: |
          PREV=$(git rev-list --tags --max-count=2 | tail -n1)
          CHANGED=$(git diff --name-only $PREV HEAD)

          PLUGINS=""
          for file in *.php; do
            name="${file%.php}"   # strip .php extension
            if echo "$CHANGED" | grep -q "^$file$"; then
              PLUGINS="$PLUGINS $name"
            fi
          done

          echo "plugins=$PLUGINS" >> $GITHUB_OUTPUT

      - name: Copy changed plugins into build folder
        run: |
          mkdir -p build
          for name in ${{ steps.changes.outputs.plugins }}; do
            mkdir -p "build/$name"
            cp "$name.php" "build/$name/$name.php"
          done

      - name: Zip changed plugins
        run: |
          for name in ${{ steps.changes.outputs.plugins }}; do
            cd build
            zip -r "${name}.zip" "$name"
            cd ..
          done

      - name: Upload ZIPs to GitHub Release
        uses: ncipollo/release-action@v1.21.0
        with:
          artifacts: "build/*.zip"
          token: ${{ secrets.GITHUB_TOKEN }}
          name: "${{ steps.changes.outputs.plugins }} - ${{ github.ref_name }}"